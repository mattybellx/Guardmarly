site_name: Guardmarly
site_description: Offline SAST for authorization gaps, IDOR and taint vulnerabilities
site_url: https://mattybellx.github.io/Guardmarly/
repo_url: https://github.com/mattybellx/Guardmarly
repo_name: mattybellx/Guardmarly
edit_uri: edit/main/docs/

docs_dir: docs
# Guard against a nav entry pointing at a page that was deleted or renamed:
# `mkdocs build --strict` (used in CI) fails the build instead of shipping 404s.
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
    - search.share
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Configuration: configuration.md
  - CI integration: ci-integration.md
  - Writing rules: writing-rules.md
  - Architecture: architecture.md
  - Benchmarks: benchmarks.md
  - FAQ / Troubleshooting: faq.md
  - Claims and evidence: https://github.com/mattybellx/Guardmarly/blob/main/CLAIMS_AND_EVIDENCE.md
  - Changelog: https://github.com/mattybellx/Guardmarly/blob/main/CHANGELOG.md
