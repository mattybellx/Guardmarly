name: Publish VS Code Extension

on:
  push:
    branches: [main]
    paths:
      - 'vscode-extension/**'
      - '.github/workflows/publish-extension.yml'
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish to VS Code Marketplace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: vscode-extension
        run: npm install

      - name: Compile extension
        working-directory: vscode-extension
        run: npm run compile

      - name: Install vsce
        working-directory: vscode-extension
        run: npm install -g @vscode/vsce

      - name: Publish to Marketplace
        working-directory: vscode-extension
        # The Marketplace gallery API (/_apis/gallery) intermittently times out
        # (see run history: many failures with "Request timeout: /_apis/gallery").
        # Retry with backoff so a single run self-heals instead of requiring
        # manual re-runs. If the version already exists, vsce fails fast and we
        # stop immediately.
        run: |
          for i in 1 2 3 4 5; do
            echo "== Publish attempt $i of 5 =="
            # GitHub Actions bash runs with `set -e`: capture the exit code
            # without letting a failed vsce kill the retry loop.
            set +e
            OUTPUT=$(vsce publish --pat "$VSCE_PAT" 2>&1)
            RC=$?
            set -e
            echo "$OUTPUT"
            if [ $RC -eq 0 ]; then
              echo "Publish succeeded (attempt $i)"
              exit 0
            fi
            if echo "$OUTPUT" | grep -qi "already exists"; then
              echo "Version already exists on the Marketplace; nothing to do."
              exit 0
            fi
            echo "Attempt $i failed (exit $RC); retrying in 20s..."
            sleep 20
          done
          echo "All publish attempts failed"
          exit 1
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
