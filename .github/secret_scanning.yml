# GitHub secret scanning — intentional fixture exclusions
#
# Guardmarly is a secret scanner, so its test data *must* contain strings that
# look like credentials: `CWE-798` fixtures that do not look like secrets cannot
# test secret detection. GitHub's secret scanning correctly cannot tell a
# fixture from a live credential, so these paths are excluded rather than the
# fixtures being weakened -- weakening them would remove the very signal they
# exist to exercise.
#
# GitHub Push Protection is separate and was not bypassed: the one live-shaped
# credential that blocked a push (an AWS key id in a generated corpus fixture)
# was *replaced*, not allow-listed, because a syntactically valid key id has no
# business in a repository at all.
#
# Scope: this silences *alerts* for these paths only. Detection everywhere else
# is unchanged, and no real credential belongs anywhere in this repository.

paths-ignore:
  # Golden corpus used by the suppression/rule self-tests.
  - ".ansede/golden_corpus/**"
  # Rule-expansion tests embed credential-shaped strings as regex test input.
  - "tests/test_phase2_registry_expansion.py"
  # Generated benchmark corpus (rebuilt by benchmarks/build_corpus.py).
  - "benchmarks/corpus/**"
  - "benchmarks/build_corpus.py"
  # Third-party vulnerable-by-design applications kept for evaluation.
  - "samples/**"
  - "dvna/**"
  - "java-sec-code/**"
  - "vulnpy/**"
