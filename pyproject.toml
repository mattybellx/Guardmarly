[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "guardmarly"
dynamic = ["version"]
description = "Static analysis for authorization gaps (IDOR/CWE-639), missing authorization, SQL injection, and 30+ vulnerability types across Python, JavaScript, Go, Java, C#, and 35+ other languages."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [
    { name = "Matty Bell" }
]
maintainers = [
    { name = "Matty Bell" }
]
keywords = [
    "security", "sast", "static-analysis", "vulnerability", "linter",
    "code-review", "cwe", "owasp", "injection", "python", "javascript",
    "idor", "authentication", "authorization", "access-control",
    "offline", "air-gapped", "cli", "devsecops", "sarif",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Environment :: Console",
    "Operating System :: OS Independent",
]
dependencies = ["rich>=13.0.0"]

[project.optional-dependencies]
dev        = ["pytest>=8", "pytest-cov>=5", "mypy>=1.10", "ruff>=0.5", "tree-sitter>=0.20; python_version>='3.9'", "tree-sitter-java>=0.21; python_version>='3.9'"]
test       = ["pytest>=8", "pytest-cov>=5"]

treesitter = ["tree-sitter>=0.20", "tree-sitter-java>=0.21"]
graph      = ["networkx>=3.0"]
schema     = ["jsonschema>=4.0"]
v2         = ["guardmarly[treesitter,graph,schema]"]

# User-friendly aliases (prefer these over the internal names above)
fast       = ["guardmarly[treesitter]"]             # tree-sitter for better Java/JS analysis
full       = ["guardmarly[treesitter,graph,schema]"] # everything
enterprise = ["guardmarly[treesitter,graph,schema]"] # enterprise alias for full

[project.scripts]
guardmarly     = "guardmarly.cli:main"
guardmarly-lsp = "guardmarly.lsp_server:run_lsp_server"

[project.urls]
Homepage   = "https://github.com/mattybellx/Guardmarly"
Repository = "https://github.com/mattybellx/Guardmarly"
Issues     = "https://github.com/mattybellx/Guardmarly/issues"
Documentation = "https://github.com/mattybellx/Guardmarly#readme"
Changelog = "https://github.com/mattybellx/Guardmarly/blob/main/CHANGELOG.md"

[tool.hatch.version]
# Single source of truth — see src/guardmarly/_version.py
path = "src/guardmarly/_version.py"

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["src", "tests"]
exclude = [
    ".venv",
    "dist",
    "build",
    "guardmarly_rust_core",
    "audit_100",
    "audit_targets",
    "samples",
    # Deliberately-vulnerable benchmark fixtures (labelled ground truth).
    # These are scanner *inputs*, not product code — see benchmarks/README.md.
    "benchmarks/corpus",
    # Generated measurement artefacts, including a copied stdlib sample.
    "benchmarks/results",
]

[tool.ruff.lint]
# Explicit selection keeps lint reproducible across ruff versions: newer ruff
# releases promote rule families to the *default* set, which would otherwise
# turn a green build red without a code change.
#
# The tree is not yet clean under the wider families (UP/SIM/BLE/I/S) — the
# ignores below are pre-existing debt, measured and tracked in IMPROVEMENTS.md.
# Do not add a rule family here until `ruff check src tests` passes with it.
select = ["E4", "E7", "E9", "F"]
ignore = [
    "E701",  # multiple statements on one line (colon) — legacy analyser style
    "E702",  # multiple statements on one line (semicolon)
    "E712",  # comparison to True/False — explicit in a few assertions
    "E741",  # ambiguous variable name (l / I / O)
    "E402",  # import not at top of file — optional-dependency guards
    "F401",  # unused import — re-export surface in package __init__
    "F811",  # redefinition while unused
    "F841",  # unused local variable
]

[tool.hatch.build.targets.wheel]
packages = ["src/guardmarly"]
artifacts = [
    "src/guardmarly/schemas/guardmarly.schema.json",
    "src/guardmarly/schemas/rule_schema.json",
]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/showcase.png",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Suppress SyntaxWarnings from dynamically compiled rule pattern code
    # (Python 3.13+ warns about invalid escape sequences in test fixture
    #  code strings compiled by the scanner's ast.parse() calls)
    "ignore::SyntaxWarning",
]

[tool.mypy]
ignore_missing_imports = true
disable_error_code = [
    "call-arg",
    "name-defined",
    "no-redef",
    "union-attr",
    "misc",
    "operator",
    "assignment",
    "attr-defined",
    "arg-type",
    "return-value",
    "call-overload",
    "truthy-function",
    "var-annotated",
    "dict-item",
]
warn_unused_ignores = false

